collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: cmd_vel_safe
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 0.5
    polygons: ["PolygonSlow", "PolygonStop"]
    PolygonSlow:
      type: polygon
      points: [0.70, 0.22, 0.70, -0.22, 0.35, -0.22, 0.35, 0.22]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: polygon_slowdown
      enabled: True
    PolygonStop:
      type: polygon
      points: [0.35, 0.18, 0.35, -0.18, 0.16, -0.18, 0.16, 0.18]
      action_type: stop
      max_points: 3
      visualize: True
      polygon_pub_topic: polygon_stop
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      enabled: True
